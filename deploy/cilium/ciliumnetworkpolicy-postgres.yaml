# CiliumNetworkPolicy: allowlist for PostgreSQL.
#
# Model: once a CiliumNetworkPolicy selects an endpoint, ALL traffic that is
# not explicitly allowed is dropped (default deny) - both directions.
# L7 awareness: Cilium parses the PostgreSQL wire protocol, so a future
# refinement can move these rules under toPorts -> rules -> postgres to
# filter statements, not just connections. DBGuard complements this at L7
# depth (per-statement firewall, PII masking, exfil accounting).
#
# Requires: Cilium installed with kubeProxyReplacement, label k8s:app=postgres
# on the database pods and k8s:app=api-server on application pods.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-allow-api
  namespace: dbguard
spec:
  endpointSelector:
    matchLabels:
      k8s:app: postgres
  ingress:
    # Only application pods may open PostgreSQL sessions.
    - fromEndpoints:
        - matchLabels:
            k8s:app: api-server
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Health probes originate from the node; keep them working.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  # Egress allowlist: DNS for cluster name resolution only. Everything else
  # (database calling out, data staged to external hosts) is denied.
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
